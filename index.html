<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0b1120" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/pwa-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prospera Contable | Pymes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!-- IMPORTANTE: Este script debe ejecutarse ANTES que cualquier módulo JS.
         Supabase limpia el hash de la URL durante su inicialización, por eso
         capturamos el tipo de recuperación aquí y lo guardamos en sessionStorage. -->
    <script>
      (function() {
        var hash = window.location.hash || '';
        var search = window.location.search || '';
        if (hash.includes('type=recovery') || search.includes('type=recovery')) {
          sessionStorage.setItem('pw_recovery_pending', 'true');
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
